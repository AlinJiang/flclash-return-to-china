# Generated by tools/build-router-config.mjs from override.js. Do not edit;
# run `node tools/build-router-config.mjs` instead.
# The NAS fills in the <...> placeholders at container start (router/compose.yaml).

mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: off
external-controller: 0.0.0.0:9090
secret: '<CONTROLLER_SECRET>'
external-ui: ui
external-ui-url: https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip
profile:
  store-selected: true
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: false
  enhanced-mode: redir-host
  default-nameserver:
    - '<UPSTREAM_DNS>'
  nameserver:
    - '<UPSTREAM_DNS>'
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
  skip-domain:
    - Mijia Cloud
    - +.push.apple.com
proxy-providers:
  airport:
    type: http
    url: '<SUBSCRIPTION_URL>'
    interval: 86400
    path: ./providers/airport.yaml
    filter: 🇨🇳|回国|大陆|内地
proxy-groups:
  - name: 回国节点
    type: url-test
    use:
      - airport
    exclude-filter: (?i)官网|网址|地址|剩余|已用|总流量|到期|过期|有效期|重置|套餐|订阅|群|频道|客服|公告|traffic|expire|website|https?://
    exclude-type: Direct|Dns|Reject|RejectDrop|Rematch
    url: http://wifi.vivo.com.cn/generate_204
    expected-status: "204"
    interval: 60
    tolerance: 300
    lazy: true
  - name: 回国或直连
    type: fallback
    proxies:
      - 回国节点
      - 回国备用
      - DIRECT
    url: http://wifi.vivo.com.cn/generate_204
    expected-status: "204"
    interval: 60
    timeout: 10000
    lazy: true
    hidden: true
  - name: 回国备用
    type: fallback
    use:
      - airport
    exclude-filter: (?i)官网|网址|地址|剩余|已用|总流量|到期|过期|有效期|重置|套餐|订阅|群|频道|客服|公告|traffic|expire|website|https?://
    exclude-type: Direct|Dns|Reject|RejectDrop|Rematch
    url: http://wifi.vivo.com.cn/generate_204
    expected-status: "204"
    interval: 60
    lazy: true
    hidden: true
  - name: GLOBAL
    type: select
    hidden: true
    proxies:
      - 回国节点
      - DIRECT
