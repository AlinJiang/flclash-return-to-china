# NAS side router: Mihomo with this repository's routing, on its own LAN
# address. Paste into Container Station > Applications > Create, fill in the
# two <...> values and check the addresses. Steps: router/README.md.
#
# Startup: fetch router/config.yaml from main, fill in the values below, check
# it with `mihomo -t` and run it. Every hour the template is fetched again; a
# changed one replaces the config and restarts the container. When GitHub is
# unreachable the last good config keeps running.
services:
  mihomo:
    image: metacubex/mihomo:v1.19.32
    container_name: mihomo-router
    # always, not unless-stopped: a NAS shutdown that stops containers through
    # the Docker API would otherwise leave the gateway down after the reboot.
    restart: always
    environment:
      # Compose expands $ even inside quotes: write each $ as $$, and a ' as ''.
      # The airport subscription link, exactly as in FlClash.
      SUBSCRIPTION_URL: '<airport subscription URL>'
      # Password for the dashboard at 192.168.50.2:9090/ui: use the output of
      # `openssl rand -hex 16`.
      CONTROLLER_SECRET: '<dashboard password>'
      # The LAN router: DNS for everything Mihomo resolves.
      UPSTREAM_DNS: 192.168.50.1
      CONFIG_URL: https://raw.githubusercontent.com/AlinJiang/flclash-return-to-china/main/router/config.yaml
      REFRESH_SECONDS: 3600
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: 1
    volumes:
      - mihomo-data:/root/.config/mihomo
    networks:
      lan:
        ipv4_address: 192.168.50.2
    # Matches the DHCP reservation that keeps 192.168.50.2 free on the router.
    mac_address: 02:42:c0:a8:32:02
    entrypoint: [/bin/sh, -c]
    # $$ is a literal $ for the shell; Compose would expand a single one.
    command:
      - |
        set -eu
        home=/root/.config/mihomo
        for value in "$$SUBSCRIPTION_URL" "$$CONTROLLER_SECRET"; do
          case "$$value" in
            '' | '<'*) echo 'Fill in SUBSCRIPTION_URL and CONTROLLER_SECRET in the compose file.' >&2; exit 1 ;;
          esac
        done
        # A value as a YAML single-quoted scalar, escaped for a sed replacement.
        escape() { printf '%s' "$$1" | sed -e "s/'/''/g" -e 's/[\\|&]/\\&/g'; }
        render() {
          wget -q -T 30 -O "$$home/template.yaml" "$$CONFIG_URL" || return 1
          sed -e "s|<SUBSCRIPTION_URL>|$$(escape "$$SUBSCRIPTION_URL")|g" \
            -e "s|<CONTROLLER_SECRET>|$$(escape "$$CONTROLLER_SECRET")|g" \
            -e "s|<UPSTREAM_DNS>|$$(escape "$$UPSTREAM_DNS")|g" \
            "$$home/template.yaml" > "$$home/next.yaml" || return 1
          /mihomo -t -d "$$home" -f "$$home/next.yaml" > /dev/null 2>&1 || { echo 'The new config does not parse; keeping the old one.' >&2; return 1; }
          if cmp -s "$$home/next.yaml" "$$home/config.yaml"; then return 1; fi
          mv "$$home/next.yaml" "$$home/config.yaml"
        }
        mkdir -p "$$home"
        render || test -s "$$home/config.yaml" || { echo 'No config yet and the template could not be fetched.' >&2; exit 1; }
        # Restarting PID 1 hands the new config to a fresh Mihomo.
        ( while sleep "$$REFRESH_SECONDS"; do if render; then kill 1; fi; done ) &
        exec /mihomo -d "$$home"

volumes:
  mihomo-data:

networks:
  lan:
    driver: macvlan
    driver_opts:
      parent: eth0
    ipam:
      config:
        - subnet: 192.168.50.0/24
          gateway: 192.168.50.1
          ip_range: 192.168.50.2/32
